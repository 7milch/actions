name: "Slack Notify"
description: "Post a status message (success / skipped / failure) to Slack via Incoming Webhook."
branding:
  icon: message-square
  color: purple

inputs:
  webhook-url:
    description: "Slack Incoming Webhook URL"
    required: true
  status:
    description: "One of: success, skipped, failure (controls color and emoji)"
    required: true
  title:
    description: "Message title"
    required: true
  message:
    description: "Body text (Slack mrkdwn)"
    required: false
    default: ""
  fields:
    description: "Extra key/value lines, one per line as `Key=Value`"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post to Slack
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        MESSAGE: ${{ inputs.message }}
        FIELDS: ${{ inputs.fields }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ github.workflow }}
      run: |
        set -euo pipefail
        case "$STATUS" in
          success) color="#2eb67d"; emoji=":white_check_mark:" ;;
          skipped) color="#8d8d8d"; emoji=":fast_forward:" ;;
          failure) color="#e01e5a"; emoji=":x:" ;;
          *) echo "unknown status: $STATUS" >&2; exit 1 ;;
        esac
        # FIELDS (Key=Value 行) を Slack の fields 配列へ変換
        fields_json="$(printf '%s\n' "$FIELDS" | sed '/^[[:space:]]*$/d' \
          | jq -R -s 'split("\n") | map(select(length > 0)) | map(capture("^(?<k>[^=]+)=(?<v>.*)$")) | map({title: .k, value: .v, short: true})')"
        payload="$(jq -n \
          --arg color "$color" --arg emoji "$emoji" --arg title "$TITLE" \
          --arg msg "$MESSAGE" --arg run "$RUN_URL" --arg repo "$REPO" --arg wf "$WORKFLOW" \
          --argjson fields "$fields_json" '
          {
            attachments: [{
              color: $color,
              blocks: (
                [{type: "section", text: {type: "mrkdwn", text: ($emoji + " *" + $title + "*" + (if $msg != "" then "\n" + $msg else "" end))}}]
                + (if ($fields | length) > 0 then [{type: "section", fields: ($fields | map({type: "mrkdwn", text: ("*" + .title + "*\n" + .value)}))}] else [] end)
                + [{type: "context", elements: [{type: "mrkdwn", text: ("<" + $run + "|" + $repo + " / " + $wf + ">")}]}]
              )
            }]
          }')"
        curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$WEBHOOK_URL" >/dev/null
